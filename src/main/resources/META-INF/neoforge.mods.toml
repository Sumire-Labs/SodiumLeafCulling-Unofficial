modLoader="javafml"
loaderVersion="[1,)"
license="${license}"
showAsResourcePack=false
issueTrackerURL="https://github.com/${github}/issues"

[[mods]]
modId="${id}"
version="${version}"
displayName="${name}"
authors="${author}, ${contributor}"
logoFile="${logo_path}"
${icon_line}
displayURL="https://github.com/${github}"
description='''${description}'''

[[mixins]]
config="${mixin_config}"
${extra_mixin_config}

[features.${id}]
javaVersion="[${java_version},)"

[[dependencies."${id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft}"
ordering="NONE"
side="CLIENT"

[[dependencies."${id}"]]
modId="${renderer_id}"
type="${renderer_dependency_type}"
versionRange="${renderer}"
ordering="AFTER"
side="CLIENT"
${extra_renderer_dependency}
