modLoader="javafml"
loaderVersion="${loader}"
license="${license}"
showAsResourcePack=false
issueTrackerURL="https://github.com/${github}/issues"

[[mods]]
modId="${id}"
version="${version}"
displayName="${name}"
authors="${author}, ${contributor}"
logoFile="assets/${namespace}/textures/mod_logo.png"
displayURL="https://github.com/${github}"
displayTest="IGNORE_ALL_VERSION"
features={java_version="[${java_version},)"}
description='''${description}'''

[[mixins]]
config="mixins.${namespace}.forge.json"

[[dependencies."${id}"]]
modId="minecraft"
mandatory=true
versionRange="${minecraft}"
ordering="NONE"
side="CLIENT"

[[dependencies."${id}"]]
modId="embeddium"
mandatory=true
versionRange="${renderer}"
ordering="AFTER"
side="CLIENT"

# Xenon already includes equivalent leaf-culling functionality. Legacy Forge
# has no dedicated incompatible dependency type, so an optional dependency
# with an intentionally impossible version requirement declares the conflict.
# Explicit publishing aliases avoid resolving the shared "xenon" mod ID to the
# unrelated Fabric utility mod with the same name.
[[dependencies."${id}"]]
modId="xenon"
mandatory=false
incompatible=true
versionRange="[0.0.0-NOT-COMPATIBLE]"
ordering="NONE"
side="CLIENT"

[dependencies."${id}".mc-publish]
modrinth="aWDwN8NN"
curseforge="564239"
