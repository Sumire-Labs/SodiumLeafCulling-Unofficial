modLoader="javafml"
loaderVersion="[1,)"
license="${license}"
showAsResourcePack=false
issueTrackerURL="https://github.com/${github}/issues"

[[mods]]
modId="${id}"
version="${version}"
displayName="${name}"
authors="${author}, ${contributor}"
logoFile="assets/${namespace}/textures/mod_logo.png"
displayURL="https://github.com/${github}"
displayTest="IGNORE_ALL_VERSION"
description='''${description}'''

[[mixins]]
config="mixins.${namespace}.json"

[features.${id}]
javaVersion="[${java_version},)"

[[dependencies."${id}"]]
modId="minecraft"
mandatory=true
versionRange="${minecraft}"
ordering="NONE"
side="CLIENT"

[[dependencies."${id}"]]
modId="${renderer_id}"
mandatory=true
versionRange="${renderer}"
ordering="AFTER"
side="CLIENT"
